[project]
name = "analyzazprav"
version = "0.1.0"
description = "Local-first message import, normalization and analysis pipeline"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0,<4",
    "streamlit>=1.61,<2",
]

[project.scripts]
az-import = "analiza_zprav_a1.cli:main"
az-normalize = "analyzazprav.normalization.cli:main"
az-process = "analyzazprav.processing.__main__:main"
az-qa = "analyzazprav.qa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
