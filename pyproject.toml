[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analiza-zprav-a1"
version = "0.1.0"
description = "Local deterministic import layer for the Analiza zprav project"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
az-import = "analiza_zprav_a1.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
