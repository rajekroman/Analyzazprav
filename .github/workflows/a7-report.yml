name: A7 report

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - agent/a0-a7-vertical

jobs:
  focused-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - name: Capture focused A7 test output
        run: |
          set +e
          python -m pytest tests/test_a7_vertical.py -vv --tb=short > a7-report.txt 2>&1
          code=$?
          echo "pytest_exit_code=$code" >> a7-report.txt
          exit 0
      - name: Publish diagnostic report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '### Temporary A7 focused CI report\n\n```text\n' > body.txt
          tail -n 180 a7-report.txt >> body.txt
          printf '\n```\n' >> body.txt
          gh pr comment 25 --body-file body.txt
