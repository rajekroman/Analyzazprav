name: A6 integration tests

on:
  push:
    branches:
      - 'agent/a6-provenance-integration'
  pull_request:
    paths:
      - 'app.py'
      - 'a6/**'
      - 'src/analyzazprav/a5_ai/integration_a6.py'
      - 'src/analyzazprav/qa/a6_contract.py'
      - 'tests/test_a6*.py'
      - 'tests/test_a5_a6*.py'
      - 'tests/test_a7_a6*.py'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/a6-tests.yml'

jobs:
  full-suite-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete repository suite
        run: pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src a6 app.py
      - name: Streamlit startup smoke test
        shell: bash
        run: |
          streamlit run app.py --server.headless true --server.port 8765 > /tmp/a6-streamlit.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8765/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/a6-streamlit.log
          exit 1
