name: A4 tests

on:
  push:
    branches:
      - agent/a4-analytics-main
  pull_request:
    paths:
      - 'database/a4_schema*.sql'
      - 'src/analyzazprav/analytics/**'
      - 'tests/test_a4*.py'
      - '.github/workflows/a4-tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - name: Run full A1 + A2 + A3 + A4 regression suite
        run: python -m pytest -q
