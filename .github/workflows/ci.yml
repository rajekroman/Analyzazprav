name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        env:
          PYTHONPATH: src
        run: |
          python -m analyza_zprav.cli --help
          db="$(mktemp -u).sqlite3"
          python -m analyza_zprav.cli --db "$db" init
          python -m analyza_zprav.cli --db "$db" verify
