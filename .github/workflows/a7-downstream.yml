name: A7 downstream validation

on:
  pull_request:
    paths:
      - 'src/analyzazprav/qa/**'
      - 'tests/test_a7_downstream.py'
      - 'tests/test_a7_release_provenance.py'
      - 'tools/a7_downstream/**'
      - 'docs/A7_QA.md'
      - '.github/workflows/a7-downstream.yml'
  push:
    branches:
      - main
      - agent/a7-downstream-validation
    paths:
      - 'src/analyzazprav/qa/**'
      - 'tests/test_a7_downstream.py'
      - 'tests/test_a7_release_provenance.py'
      - 'tools/a7_downstream/**'
      - 'docs/A7_QA.md'
      - '.github/workflows/a7-downstream.yml'

jobs:
  core-a7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - name: Run integrated A1-A4 plus authoritative A7 oracle/regression suite
        run: python -m pytest -q
      - name: Write integrated core report
        run: >-
          printf '%s\n'
          '{"schema_version":1,"module":"core","status":"PASS","verdict":"VALID","contract_sha":"${{ github.sha }}","scope":"integrated A1-A4 plus authoritative A7 tests on current branch"}'
          > a7-core-report.json
      - name: Upload core report
        uses: actions/upload-artifact@v4
        with:
          name: a7-core-report
          path: a7-core-report.json

  a5-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A7
        uses: actions/checkout@v4
      - name: Checkout pinned A5
        uses: actions/checkout@v4
        with:
          ref: c1c5a0e9d5ec1933370054404bf3612f53f5a63e
          path: a5-under-test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run actual A5 through independent evidence audit
        env:
          PYTHONPATH: ${{ github.workspace }}/a5-under-test/src:${{ github.workspace }}
        run: python tools/a7_downstream/a5_live.py --report a7-a5-report.json
      - name: Upload A5 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a7-a5-report
          path: a7-a5-report.json
          if-no-files-found: ignore

  a6-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A7
        uses: actions/checkout@v4
      - name: Checkout pinned A6
        uses: actions/checkout@v4
        with:
          ref: f54c2807176515f509af50f340ea8f60a1ff7aea
          path: a6-under-test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install A6 read-model dependency
        run: python -m pip install pandas
      - name: Run A6 against production A2 v6 fixture
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/a6-under-test:${{ github.workspace }}
        run: python tools/a7_downstream/a6_live.py --a6-root a6-under-test --report a7-a6-report.json
      - name: Upload A6 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a7-a6-report
          path: a7-a6-report.json
          if-no-files-found: ignore

  release-verdict:
    if: always()
    needs: [core-a7, a5-live, a6-live]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download component reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: a7-*-report
          path: a7-reports
          merge-multiple: true
      - name: Aggregate release verdict
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python tools/a7_downstream/release_verdict.py
          --reports a7-reports
          --report a7-release-verdict.json
          --core-result '${{ needs.core-a7.result }}'
          --a5-result '${{ needs.a5-live.result }}'
          --a6-result '${{ needs.a6-live.result }}'
          --core-sha '${{ github.sha }}'
          --a5-sha 'c1c5a0e9d5ec1933370054404bf3612f53f5a63e'
          --a6-sha 'f54c2807176515f509af50f340ea8f60a1ff7aea'
      - name: Upload release verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a7-release-verdict
          path: a7-release-verdict.json
          if-no-files-found: ignore
