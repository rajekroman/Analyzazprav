name: A2 tests

on:
  push:
    branches:
      - agent/a2-normalization-db
  pull_request:
    paths:
      - 'database/**'
      - 'src/analyzazprav/normalization/**'
      - 'tests/test_a2_*.py'
      - 'docs/A1_A2_CONTRACT.md'
      - 'pyproject.toml'
      - '.github/workflows/a2-tests.yml'

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and CLI
        run: python -m pip install -e .
      - name: Verify CLI entry point
        run: az-normalize --help
      - name: Run A2 unit and integration tests
        run: python -m unittest discover -s tests -v
