name: A7 QA

on:
  push:
    branches:
      - main
      - agent/a7-qa-validation
    paths:
      - "qa/**"
      - "src/analyzazprav/normalization/**"
      - "src/analyzazprav/processing/**"
      - "database/**"
      - "docs/qa-validation.md"
      - "pyproject.toml"
      - ".github/workflows/a7-qa.yml"
  pull_request:
    paths:
      - "qa/**"
      - "src/analyzazprav/normalization/**"
      - "src/analyzazprav/processing/**"
      - "database/**"
      - "docs/qa-validation.md"
      - "pyproject.toml"
      - ".github/workflows/a7-qa.yml"

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install canonical package
        run: python -m pip install -e .
      - name: Run A7 regression and integration tests
        run: python -m unittest discover -s qa/tests -v
      - name: Validate golden fixture
        run: python -m qa.staging_validator qa/fixtures/golden --report a7-golden-report.json
      - name: Confirm corrupt fixture fails
        shell: bash
        run: |
          if python -m qa.staging_validator qa/fixtures/corrupt; then
            echo "Corrupt fixture unexpectedly passed"
            exit 1
          fi

  a4-pinned-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A7
        uses: actions/checkout@v4
      - name: Checkout pinned A4 v6
        uses: actions/checkout@v4
        with:
          ref: ff18c7bd561583451f5b1c5f57f2cc0c82b5d200
          path: a4-under-test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned A4 stack
        run: python -m pip install -e a4-under-test
      - name: Compare actual A4 output with independent A7 oracle
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/a4-under-test/src
        run: python -m qa.a4_live_contract

  a5-pinned-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A7
        uses: actions/checkout@v4
      - name: Checkout pinned A5
        uses: actions/checkout@v4
        with:
          ref: b729befb2c881d3ce04d19ca735da8bd8054ab2c
          path: a5-under-test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned A5 stack
        run: python -m pip install -e a5-under-test
      - name: Audit A5 evidence chain
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/a5-under-test/src
        run: python -m qa.a5_live_contract --expect VALID --report a7-a5-report.json

  a6-pinned-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A7
        uses: actions/checkout@v4
      - name: Checkout pinned A6
        uses: actions/checkout@v4
        with:
          ref: ef9c2e4c7d89f93a82c16b30fcef7639b5fc1e31
          path: a6-under-test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install A6 read-model dependency
        run: python -m pip install pandas
      - name: Audit known A6 v5 lossless-read blockers
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/a6-under-test
        run: python -m qa.a6_live_contract --expect INVALID --report a7-a6-report.json
