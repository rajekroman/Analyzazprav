name: A1 tests

on:
  pull_request:
    paths:
      - 'src/analiza_zprav_a1/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/a1-tests.yml'
  push:
    branches:
      - 'agent/a1-imessage-import'
    paths:
      - 'src/analiza_zprav_a1/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/a1-tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
