name: A1 tests

on:
  pull_request:
    paths:
      - 'src/analiza_zprav_a1/**'
      - 'src/analyzazprav/normalization/**'
      - 'database/**'
      - 'tests/**'
      - 'docs/A1_IMPORT.md'
      - 'docs/A1_A2_CONTRACT.md'
      - 'pyproject.toml'
      - '.github/workflows/a1-tests.yml'
  push:
    branches:
      - 'main'
      - 'agent/a1-imessage-import'
      - 'agent/a0-a1-integration'
    paths:
      - 'src/analiza_zprav_a1/**'
      - 'src/analyzazprav/normalization/**'
      - 'database/**'
      - 'tests/**'
      - 'docs/A1_IMPORT.md'
      - 'docs/A1_A2_CONTRACT.md'
      - 'pyproject.toml'
      - '.github/workflows/a1-tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - name: Verify unified CLI entry points
        run: |
          az-import --help
          az-normalize --help
      - name: Run combined A1/A2 regression suite
        run: python -m pytest -q
